<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>幽灵光标演示 · Ghost Cursor Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 10%, #eef2ff 0%, #f8fafc 45%, #eef2ff 100%);
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        width: min(920px, 88vw);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 24px 60px -24px rgba(15, 23, 42, 0.35);
        padding: 40px 44px 44px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 30px;
        letter-spacing: -0.4px;
      }
      p.lead {
        margin: 0 0 28px;
        color: #475569;
        font-size: 15px;
        line-height: 1.7;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      button {
        appearance: none;
        border: 1px solid #c7d2fe;
        background: linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
        color: #312e81;
        font: 600 16px/1.2 inherit;
        padding: 22px 16px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -16px rgba(49, 46, 129, 0.55);
      }
      button:active {
        transform: translateY(0);
      }
      output {
        display: block;
        margin-top: 26px;
        min-height: 28px;
        font-size: 16px;
        color: #4338ca;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>幽灵光标演示</h1>
      <p class="lead">
        这一页用来验证 MCP 模拟鼠标：点击下面的按钮时，页面上应出现一个箭头指针<strong>移动</strong>到按钮中心，
        按下瞬间还会有一圈<strong>涟漪</strong>扩散。指针由页面内的覆盖层绘制（pointer-events:none），
        真实的鼠标事件仍由 CDP 派发。
      </p>
      <div class="grid">
        <button id="btn-a" type="button" data-label="按钮 A">按钮 A</button>
        <button id="btn-b" type="button" data-label="按钮 B">按钮 B</button>
        <button id="btn-c" type="button" data-label="按钮 C">按钮 C</button>
      </div>
      <output id="out">尚未点击</output>
    </main>
    <script>
      const out = document.getElementById('out');
      let clicks = 0;
      for (const button of document.querySelectorAll('button')) {
        button.addEventListener('click', () => {
          clicks += 1;
          out.textContent = `已点击 ${button.dataset.label}（累计 ${clicks} 次）`;
        });
      }
    </script>
  </body>
</html>
